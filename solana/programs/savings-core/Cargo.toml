[package]
name = "savings-core"
version = "0.1.0"
description = "Solana Savings Wallet Core Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "savings_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["dev-timelock"]
dev-timelock = []
prod-timelock = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"