<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Money You Can't Touch Until You Say So | LockIn</title>
    <meta name="description" content="Give yourself an allowance and a waiting period. Anything above the allowance has to be announced and wait — a day to three months — and no one can skip the wait. Sign in with your email. Free to start." />
    <meta name="keywords" content="protect your savings, forced savings app, no withdrawal savings account, account you can't withdraw from, how to stop impulse spending, how to control spending habits, lock money until a date, savings I can't withdraw from, how to stop spending my savings" />
    <link rel="canonical" href="https://lockinwallet.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lockinwallet.com/" />
    <meta property="og:title" content="Money You Can't Touch Until You Say So" />
    <meta property="og:description" content="Every savings tool has an unlock button. This one makes you announce it — and wait. Rules kept by open-source code, not by good intentions." />
    <meta property="og:site_name" content="LockIn Wallet" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Money You Can't Touch Until You Say So" />
    <meta name="twitter:description" content="Every savings tool has an unlock button. This one makes you announce it — and wait. Rules kept by open-source code, not by good intentions." />

    <!-- Theme -->
    <meta name="theme-color" content="#0b0d0f" />
    <meta name="application-name" content="LockIn Wallet" />

    <!-- IBM Plex Mono carries anything the contract says: amounts, clocks,
         addresses, status. Reading text stays in the system sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" type="image/png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Analytics loads from src/utils/analytics.js, not here. A tag in
         this file fires before React mounts, which reported referral links
         (/?ref=<wallet address>) to Google before anything could scrub them. -->

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "LockIn Wallet",
      "url": "https://lockinwallet.com",
      "description": "Money you can't touch until you say so. Give yourself an allowance and a waiting period; anything above the allowance has to be announced and wait, and no one can skip the wait.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LockIn Wallet",
      "url": "https://lockinwallet.com",
      "description": "Savings software with an allowance you choose and a wait nobody can skip — kept by open-source code, not by good intentions."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
