<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Protect Your Savings From Everyone, Even Yourself | LockIn</title>
    <meta name="description" content="A commitment savings account with blockchain-enforced withdrawal limits and 24-hour time locks. Hackers can't drain it. You can't impulse spend it." />
    <meta name="keywords" content="protect your savings, commitment savings account, forced savings app, no withdrawal savings account, account you can't withdraw from, how to stop impulse spending, how to control spending habits" />
    <link rel="canonical" href="https://lockinwallet.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lockinwallet.com/" />
    <meta property="og:title" content="Protect Your Savings From Everyone — Even Yourself | LockIn Wallet" />
    <meta property="og:description" content="A commitment savings account with blockchain-enforced withdrawal limits and 24-hour time locks. Safe from hackers, safe from impulse spending." />
    <meta property="og:site_name" content="LockIn Wallet" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Protect Your Savings From Everyone — Even Yourself" />
    <meta name="twitter:description" content="A commitment savings account with blockchain-enforced withdrawal limits and 24-hour time locks. Safe from hackers, safe from impulse spending." />

    <!-- Theme -->
    <meta name="theme-color" content="#0b0d0f" />
    <meta name="application-name" content="LockIn Wallet" />

    <!-- IBM Plex Mono carries anything the contract says: amounts, clocks,
         addresses, status. Reading text stays in the system sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" type="image/png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Analytics loads from src/utils/analytics.js, not here. A tag in
         this file fires before React mounts, which reported referral links
         (/?ref=<wallet address>) to Google before anything could scrub them. -->

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "LockIn Wallet",
      "url": "https://lockinwallet.com",
      "description": "Protect your savings from everyone, even yourself. A commitment savings account with blockchain-enforced withdrawal limits and 24-hour time locks that stop hackers and impulse spending alike.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LockIn Wallet",
      "url": "https://lockinwallet.com",
      "description": "Blockchain-powered commitment savings platform that protects your savings from everyone — even yourself."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
