name: Release

# Pushing a version tag (v0.2.0) publishes a GitHub Release whose body is
# that version's section extracted from CHANGELOG.md — the changelog stays
# the single source of truth; the Releases tab mirrors it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No CHANGELOG.md section found for $VERSION" >&2
            exit 1
          fi
          cat release-body.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          name: ${{ github.ref_name }}
